services:
  opensnowcat:
    image: ghcr.io/opensnowcat/opensnowcat-collector-stdout:latest
    container_name: opensnowcat-local
    ports:
      - "8080:8080"
    volumes:
      - ./config.hocon:/opensnowcat/config.hocon:ro
    command: ["--config", "/opensnowcat/config.hocon"]
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
